name: Feature Request
description: Propose a website enhancement, new localization, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What problem does this solve or what capability would it add?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Outline the desired UX, technical approach, or workflow change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landing & Marketing
        - Auth & Onboarding
        - Internationalization (i18n)
        - CI / Repository Tooling
        - Docs / Other
