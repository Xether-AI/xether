version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      nextjs-react:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "next-intl"
      ui-styling:
        patterns:
          - "lucide-react"
          - "framer-motion"
          - "tailwind*"
          - "@tailwindcss/*"
          - "@radix-ui/*"
      testing-linting:
        patterns:
          - "vitest"
          - "@playwright/*"
          - "eslint*"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
